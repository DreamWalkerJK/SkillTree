<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SkillTree：面向开发者的结构化技术知识库，涵盖 .NET、架构、算法、密码学、数据库、云原生与网络安全。"
    />
    <meta name="theme-color" content="#f4f7fb" />
    <title>SkillTree · Developer Knowledge Base</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 20h28v7H36v22h-8V27H18z' fill='white'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=20260828-1" />

    <script>
      (function () {
        const savedTheme = localStorage.getItem("skilltree-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app">跳到正文</a>
    <div
      id="reading-progress"
      class="reading-progress"
      role="progressbar"
      aria-label="页面阅读进度"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    ></div>
    <header id="site-toolbar" class="site-toolbar" aria-label="站点工具栏">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="切换深浅主题"
        title="切换深浅主题"
      >
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </header>

    <div id="app">
      <div class="boot-screen">
        <span class="boot-mark">ST</span>
        <span>正在加载 SkillTree...</span>
      </div>
    </div>

    <button
      id="scroll-top"
      class="scroll-top"
      type="button"
      aria-label="返回顶部"
      title="返回顶部"
      hidden
    >
      <span aria-hidden="true">↑</span>
    </button>

    <script>
      const localPreview = ["localhost", "127.0.0.1"].includes(
        window.location.hostname
      );

      window.$docsify = {
        name: "SkillTree",
        nameLink: "#/",
        homepage: "docs/home.md",
        basePath: localPreview
          ? "../"
          : "https://raw.githubusercontent.com/DreamWalkerJK/SkillTree/main/",
        loadSidebar: "docs/_sidebar.md",
        loadNavbar: "docs/_navbar.md",
        notFoundPage: "docs/_404.md",
        alias: {
          "/.*/docs/_sidebar.md": "/docs/_sidebar.md",
          "/.*/docs/_navbar.md": "/docs/_navbar.md"
        },
        auto2top: true,
        relativePath: true,
        maxLevel: 4,
        subMaxLevel: 3,
        mergeNavbar: true,
        externalLinkTarget: "_blank",
        topMargin: 28,
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "搜索文章、标题或关键字",
          noData: "没有找到相关内容",
          depth: 5,
          hideOtherSidebarContent: false
        },
        pagination: {
          previousText: "上一篇",
          nextText: "下一篇",
          crossChapter: true,
          crossChapterText: true
        },
        copyCode: {
          buttonText: "复制",
          errorText: "复制失败",
          successText: "已复制"
        }
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="./assets/site.js?v=20260828-1"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  </body>
</html>
